name: Update public rental listings
on:
  workflow_dispatch:
  schedule:
    - cron: '18 6 * * *'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python scripts/update_rentals.py
      - name: Publish changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rentals.json
          if ! git diff --cached --quiet; then git commit -m 'Refresh public rental listings'; git push; fi
